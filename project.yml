name: TarBackupExample

options:
  bundleIdPrefix: com.logdok
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

packages:
  TarBackup:
    url: https://github.com/logdok/TarBackup.git
    from: 1.1.0

targets:
  TarBackupExample:
    type: application
    platform: iOS
    sources:
      - TarBackupExample
    dependencies:
      - package: TarBackup
    info:
      path: TarBackupExample/Info.plist
      properties:
        CFBundleDisplayName: TarBackup Demo
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        DEVELOPMENT_TEAM: P3F5YYV27J
        PRODUCT_BUNDLE_IDENTIFIER: com.logdok.TarBackupExample
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  TarBackupExample:
    build:
      targets:
        TarBackupExample: all
    run:
      config: Debug
